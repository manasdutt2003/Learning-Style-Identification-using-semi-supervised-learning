name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint (syntax errors and undefined names)
        run: |
          pip install ruff
          ruff check . --select E9,F63,F7,F82 --exclude "*.ipynb"
      - name: Byte-compile
        run: python -m compileall -q .
