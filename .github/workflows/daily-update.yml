name: Daily Learning Stats Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Run Tests and Update Badge
      run: |
        python run_tests_and_update_badge.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name 'Manas Dutt'
        git config --global user.email 'manasdutt2003@gmail.com'
        git add coverage.svg
        git commit -m "chore: update test coverage badge [skip ci]" || echo "No changes to commit"
        git push
